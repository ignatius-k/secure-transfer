server:
  port: 8080

spring:
  application:
    name: secure-transfer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/secure_transfer}
    username: ${DB_USERNAME:secure_transfer}
    password: ${DB_PASSWORD:secure_transfer}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      issuer: secure-transfer
      access-token-ttl: 15m
  demo-data:
    # Seeds demo users and accounts on first start. Disable outside local/dev.
    enabled: ${DEMO_DATA_ENABLED:true}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
